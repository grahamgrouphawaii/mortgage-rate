name: Update mortgage rate
on:
  schedule:
    # Freddie Mac publishes Thursdays at noon Eastern; check Thursday afternoon and again Friday morning
    - cron: "30 19 * * 4"
    - cron: "0 15 * * 5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- rate.json; then echo "No change"; exit 0; fi
          git config user.name "rate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "Checked rate: week of $(python -c 'import json;print(json.load(open("rate.json"))["week"])')"
          git push
